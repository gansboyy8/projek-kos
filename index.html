<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f3" />
    <meta name="description" content="Kelola kamar kos, penghuni, pembayaran, dan pengeluaran dalam satu tempat." />
    <title>RuangKos — Manajemen Kos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-screen" id="authScreen"></main>
    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" data-page="dashboard" aria-label="RuangKos, dashboard">
          <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>ruang<span>kos</span></strong><small>PROPERTY MANAGER</small></span>
        </a>
        <div class="sidebar-label">MENU UTAMA</div>
        <nav class="main-nav" aria-label="Navigasi utama">
          <button class="nav-link active owner-only" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
          <button class="nav-link owner-only" data-page="rooms"><span class="nav-icon">▦</span>Kamar <span class="nav-count" id="roomNavCount">0</span></button>
          <button class="nav-link owner-only" data-page="residents"><span class="nav-icon">♙</span>Penghuni</button>
          <button class="nav-link owner-only" data-page="bills"><span class="nav-icon">▤</span>Tagihan</button>
          <button class="nav-link owner-only" data-page="maintenance"><span class="nav-icon">⚒</span>Laporan gangguan <span class="nav-count" id="maintenanceNavCount" hidden>0</span></button>
          <button class="nav-link owner-only" data-page="payments"><span class="nav-icon">↗</span>Pembayaran</button>
          <button class="nav-link owner-only" data-page="expenses"><span class="nav-icon">↙</span>Pengeluaran</button>
          <button class="nav-link owner-only" data-page="reports"><span class="nav-icon">▤</span>Laporan</button>
          <button class="nav-link resident-only" data-page="resident-home" hidden><span class="nav-icon">⌂</span>Beranda</button>
          <button class="nav-link resident-only" data-page="resident-bills" hidden><span class="nav-icon">▤</span>Tagihan saya</button>
          <button class="nav-link resident-only" data-page="resident-maintenance" hidden><span class="nav-icon">⚒</span>Laporan gangguan</button>
          <button class="nav-link resident-only" data-page="resident-history" hidden><span class="nav-icon">↗</span>Riwayat pembayaran</button>
          <button class="nav-link resident-only" data-page="resident-profile" hidden><span class="nav-icon">♙</span>Profil saya</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card">
            <div class="help-spark">✳</div>
            <strong>Semua lebih tertata.</strong>
            <p>Data tersimpan otomatis di server kos.</p>
            <span class="local-badge"><i></i> Server kos</span>
          </div>
          <button class="profile-button" id="profileButton">
            <span class="avatar owner-avatar">A</span>
            <span class="profile-info"><strong>Admin Kos</strong><small>Pengelola</small></span>
            <span class="profile-dots">Keluar</span>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" aria-label="Buka navigasi">☰</button>
          <div class="breadcrumb"><span>Manajemen kos</span><b>/</b><strong id="breadcrumbCurrent">Dashboard</strong></div>
          <div class="topbar-right">
            <span class="today-label" id="todayLabel"></span>
            <span class="topbar-divider"></span>
            <span class="avatar top-avatar">A</span>
            <button class="button button-quiet header-logout" id="logoutButton" type="button">Keluar</button>
          </div>
        </header>
        <section class="page-content" id="pageContent" aria-live="polite"></section>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <div><span class="eyebrow" id="modalEyebrow">FORMULIR</span><h2 id="modalTitle"></h2></div>
          <button class="icon-button" id="closeModal" aria-label="Tutup">×</button>
        </div>
        <form id="modalForm">
          <div class="modal-fields" id="modalFields"></div>
          <div class="modal-footer">
            <button type="button" class="button button-quiet" id="cancelModal">Batal</button>
            <button type="submit" class="button button-primary" id="saveModal">Simpan data <span>→</span></button>
          </div>
        </form>
      </section>
    </div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
