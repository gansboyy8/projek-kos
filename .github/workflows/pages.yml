name: Deploy RuangKos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        env:
          RUANGKOS_API_URL: ${{ vars.RUANGKOS_API_URL }}
        run: |
          mkdir _site
          cp index.html app.js styles.css _site/
          node -e 'const fs = require("node:fs"); const url = (process.env.RUANGKOS_API_URL || "").trim().replace(/\/+$/, ""); fs.writeFileSync("_site/config.js", `window.RUANGKOS_API_URL = ${JSON.stringify(url)};\n`);'
          sed -i "s|src=\"config.js\"|src=\"config.js?v=${GITHUB_SHA}\"|; s|src=\"app.js\"|src=\"app.js?v=${GITHUB_SHA}\"|" _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
